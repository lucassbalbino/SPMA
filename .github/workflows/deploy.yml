# Deploy de produção na VPS (docs/DEPLOY_PRODUCAO.md).
#
# O build acontece AQUI, não na VPS: com 2 GB de RAM, `npm ci` + `next build`
# disputariam memória com o MySQL e o próprio app no ar. A VPS só recebe o
# pacote standalone pronto, aplica as migrations e reinicia o serviço.
name: deploy-producao

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; um push novo espera o anterior terminar.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    # Precisa ser Linux x64 como a VPS: o rastreamento do standalone copia o
    # binário nativo do argon2 da plataforma em que o build roda.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # prisma.config.ts usa env("DATABASE_URL"), que falha se a variável não
    # existir. Nenhuma rota é pré-renderizada com dados, então nem o generate
    # nem o build conectam ao banco - a URL só precisa existir.
    env:
      DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Num clone limpo faltam dois artefatos gerados, ambos fora do git:
      # o client do Prisma (`src/generated/`, importado como
      # `@/generated/prisma/*`) e os tipos globais de rota do Next
      # (`LayoutProps`, `PageProps`, em `.next/types`). Sem eles o `tsc`
      # falha antes do build.
      - name: Gerar Prisma Client e tipos de rota
        run: |
          npx prisma generate
          npx next typegen

      - name: Verificar (tipos, lint, testes unitários)
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit

      - name: Build
        run: npm run build

      - name: Empacotar
        run: |
          cp -r .next/static .next/standalone/.next/
          mkdir -p .next/standalone/prisma
          cp -r prisma/migrations prisma/schema.prisma .next/standalone/prisma/
          cp prisma.config.ts .next/standalone/
          tar -czf spma.tgz -C .next/standalone .

      # `tr -d '\r'`: secrets colados a partir do Windows (Set-Clipboard)
      # chegam com CRLF, e o OpenSSH do Linux rejeita chave e known_hosts com
      # `\r` no fim da linha ("Host key verification failed").
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "::error::VPS_SSH_KEY não é uma chave privada válida"; exit 1; }
          ssh-keygen -l -f ~/.ssh/known_hosts || { echo "::error::VPS_KNOWN_HOSTS não tem chaves válidas"; exit 1; }
          printf 'Host vps\n  HostName %s\n  Port %s\n  User spma\n  ConnectTimeout 20\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_PORT }}" > ~/.ssh/config

      - name: Enviar e publicar
        run: |
          scp spma.tgz "vps:/tmp/spma-$GITHUB_SHA.tgz"
          scp deploy/deploy.sh vps:/opt/spma/deploy.sh
          ssh vps "chmod +x /opt/spma/deploy.sh && /opt/spma/deploy.sh $GITHUB_SHA"
