# Proxy reverso do SPMA. Instalar em /etc/nginx/sites-available/spma,
# trocando SPMA_DOMINIO pelo domínio real. O certbot acrescenta o bloco
# HTTPS (listen 443 + certificado) e o redirecionamento de HTTP.
#
# HSTS e os demais cabeçalhos de segurança já saem do Next (next.config.ts);
# não repetir aqui, senão o navegador recebe o cabeçalho em dobro.
server {
    listen 80;
    listen [::]:80;
    server_name SPMA_DOMINIO;

    server_tokens off;
    client_max_body_size 2m;

    # Assets com hash no nome: servidos direto do disco, sem passar pelo Node.
    location /_next/static/ {
        alias /opt/spma/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SUBSTITUI o X-Forwarded-For pelo IP real da conexão. O rate limit
        # por IP (src/lib/auth/rate-limit-ip.ts) lê o PRIMEIRO IP desse
        # cabeçalho: com $proxy_add_x_forwarded_for o cliente poderia mandar
        # um IP falso na frente e escapar do bloqueio (REQ-SEC-03).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming/Suspense do App Router: sem buffer, o HTML chega aos poucos.
        proxy_buffering off;
    }
}
